name: CD Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-app]

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Image Version
        run: |
          sed -i "s|image: .*|image: magibalan07/spring-boot-crud-postgres-adminer:${{ github.event.client_payload.image_tag }}|g" 05-java-deployment.yaml

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add 05-java-deployment.yaml

          git commit -m "Update image to ${{ github.event.client_payload.image_tag }}" || true

          git push

      - name: Verify Kind Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy To Kind
        run: |
          kubectl apply -f 05-java-deployment.yaml

      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get svc