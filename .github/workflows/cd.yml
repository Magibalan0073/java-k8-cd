name: CD Pipeline

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-app]

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Image Version
        shell: pwsh
        run: |
          (Get-Content 05-java-deployment.yaml) `
            -replace 'image: .*', 'image: magibalan07/spring-boot-crud-postgres-adminer:${{ github.event.client_payload.image_tag }}' |
            Set-Content 05-java-deployment.yaml

      - name: Commit Changes
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add 05-java-deployment.yaml

          git commit -m "Update image to ${{ github.event.client_payload.image_tag }}" || echo "No changes to commit"

          git push